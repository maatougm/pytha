# =============================================================================
# School Hub - PRODUCTION DEPLOYMENT
# =============================================================================
# ⚠️  PRODUCTION USE ONLY - Requires SSL certificates and proper secrets
#
# USAGE:
#   1. Copy .env.production to .env and fill in your secrets
#   2. Generate strong secrets (see .env.production comments)
#   3. Run: docker-compose -f docker-compose.prod.yml up -d --build
#
#   For first deployment with monitoring:
#   docker-compose -f docker-compose.prod.yml --profile with-backup --profile with-logging up -d --build
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database (Production)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: school_messaging
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Production hardening
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./init-scripts:/docker-entrypoint-initdb.d
    # NO external port - only accessible via internal network
    expose:
      - "5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d school_messaging"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Redis Cache (Production)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sms_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # NO external port
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Backend API Server (Production)
  # ===========================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    #container_name: sms_server_prod
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/school_messaging?schema=public&connection_limit=20
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # JWT (MUST be 32+ characters in production)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # Server
      PORT: 3000
      NODE_ENV: production
      
      # CORS - Your production domains only
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      
      # Rate Limiting (strict for production)
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # File Upload
      MAX_FILE_SIZE: 10485760
      UPLOAD_DEST: ./uploads
      
      # Security
      BCRYPT_ROUNDS: 12
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      
      # S3/Object Storage (for production file storage)
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      
      # Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ===========================================================================
  # Flutter Web Frontend (Production Build)
  # ===========================================================================
  # This service builds the Flutter web app WITHIN Docker using the
  # provided API_BASE_URL build argument. No local build required.
  # ===========================================================================
  flutter_web:
    image: nginx:alpine
    container_name: sms_flutter_web_prod
    volumes:
      - ./mobile/build/web:/usr/share/nginx/html:ro
    restart: always
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Nginx Load Balancer / Reverse Proxy
  # ===========================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sms_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # These are substituted into nginx.conf at container startup
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_BASE_URL: ${API_BASE_URL}
    volumes:
      # SSL certificates - mount your certs here
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Logs
      - ./logs/nginx:/var/log/nginx
      # Certbot for Let's Encrypt (optional)
      - ./certbot/data:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - server
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Backup Service (Automated backups)
  # ===========================================================================
  # Enable with: --profile with-backup
  # ===========================================================================
  backup:
    image: postgres:16-alpine
    container_name: sms_backup_prod
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: school_messaging
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 7
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "echo '0 2 * * * /backup.sh' | crontab - && crond -f"
    depends_on:
      - postgres
    networks:
      - backend
    profiles:
      - with-backup

  # ===========================================================================
  # Log Aggregation (Optional - enable with --profile with-logging)
  # ===========================================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: sms_loki_prod
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    profiles:
      - with-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: sms_prometheus_prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
    profiles:
      - with-logging

  grafana:
    image: grafana/grafana:latest
    container_name: sms_grafana_prod
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - backend
    profiles:
      - with-logging

# ===========================================================================
# Networks
# ===========================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # Backend network has no external access

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  loki_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
