version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_messaging
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    # No ports exposed - only accessible within Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sms_user} -d school_messaging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    # No ports exposed - only accessible within Docker network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sms_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-sms_user}:${DB_PASSWORD:-change_me_in_production}@postgres:5432/school_messaging?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yourdomain.com}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sms_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - sms_network

volumes:
  pgdata:
  redisdata:

networks:
  sms_network:
    driver: bridge
