# =============================================================================
# Log Rotation Configuration for School Hub
# =============================================================================
# Install: Copy this file to /etc/logrotate.d/school-hub
# Or run: sudo ./scripts/setup-logrotate.sh
# =============================================================================

/path/to/project/logs/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Reload nginx to release file handles
        docker exec sms_nginx_prod nginx -s reload 2>/dev/null || true
    endscript
}

/path/to/project/logs/server/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
}

/path/to/project/backups/*.sql.gz {
    daily
    rotate 7
    compress
    missingok
    notifempty
}
