# Simple nginx container for School Hub status page
# This provides a status page showing the backend is running

services:
  nginx:
    image: nginx:alpine
    container_name: school-hub-nginx
    ports:
      - "8088:80"
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx/nginx-simple.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - school-hub

networks:
  school-hub:
    external: true
    name: minivirson_school-hub-network
