name: pythagore
description: Pythagore - School Messaging & Learning Platform
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Local Storage & Security
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # UI & UX
  cached_network_image: ^3.4.1
  dropdown_search: ^5.0.6
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  timeago: ^3.7.0
  intl: ^0.19.0

  # File Handling
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  path_provider: ^2.1.5

  # App Updates & Permissions
  package_info_plus: ^8.1.3
  permission_handler: ^11.3.1

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
