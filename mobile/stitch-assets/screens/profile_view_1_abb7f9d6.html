<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile View - Pythagore</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        display: ["Lexend", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen flex-col overflow-hidden max-w-md mx-auto bg-white dark:bg-slate-900 shadow-2xl">
<!-- Header / Navigation -->
<header class="flex items-center justify-between p-4 pb-2 bg-white dark:bg-slate-900">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-slate-900 dark:text-white">My Profile</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>
</header>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto px-4 pb-20 scrollbar-hide">
<!-- Profile Info Section -->
<div class="flex flex-col items-center py-6">
<div class="relative mb-4">
<div class="h-28 w-28 rounded-full bg-cover bg-center border-4 border-white dark:border-slate-800 shadow-lg" data-alt="Portrait of a female student smiling" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAQERS9ImJoGOi0nUvsykUdcYr6cNtMH8OZrfSb3Ve-dm3IE9FqtU91oXNSsg3jMg6EvAvOP0qQYxTxmKsxbooMpnPX_ACzs5Ef_YnXlqrT_1yGeb8_rNjBAaKOvbNB6lfGSGhmxMB3BdlPLoGHaZ1XQ7MYnXBlcF56cqjthhlLZxVzCPjINh-tA1pz8gkFbSzI_MMG0Xv5gzjeevbN8gfgaxfj6_6Zyz_WDPo6tDLN2RZEA22buoGYeLMzBNVcZsTV_2Ri_oFcBCyV');"></div>
<div class="absolute bottom-0 right-0 bg-primary text-white rounded-full p-1.5 border-2 border-white dark:border-slate-800 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-sm">edit</span>
</div>
</div>
<h2 class="text-xl font-bold text-slate-900 dark:text-white mb-1">Alex Johnson</h2>
<div class="flex items-center gap-2 mb-2">
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wide">Student</span>
<span class="text-slate-500 dark:text-slate-400 text-sm">Class 10-A</span>
</div>
</div>
<!-- Stats/Quick Info (Optional but adds to the school context) -->
<div class="grid grid-cols-3 gap-4 mb-6">
<div class="flex flex-col items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
<span class="text-primary font-bold text-lg">94%</span>
<span class="text-slate-500 dark:text-slate-400 text-xs">Attendance</span>
</div>
<div class="flex flex-col items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
<span class="text-primary font-bold text-lg">3.8</span>
<span class="text-slate-500 dark:text-slate-400 text-xs">GPA</span>
</div>
<div class="flex flex-col items-center p-3 bg-slate-50 dark:bg-slate-800 rounded-xl">
<span class="text-primary font-bold text-lg">12</span>
<span class="text-slate-500 dark:text-slate-400 text-xs">Activities</span>
</div>
</div>
<!-- Menu List -->
<div class="flex flex-col gap-3">
<!-- Personal Information -->
<button class="flex items-center p-4 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md transition-shadow group">
<div class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<div class="ml-4 flex-1 text-left">
<h3 class="text-base font-semibold text-slate-900 dark:text-white">Personal Information</h3>
<p class="text-xs text-slate-500 dark:text-slate-400">Contact details, address, parent info</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- School Details -->
<button class="flex items-center p-4 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md transition-shadow group">
<div class="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-900/20 flex items-center justify-center text-indigo-600 dark:text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">school</span>
</div>
<div class="ml-4 flex-1 text-left">
<h3 class="text-base font-semibold text-slate-900 dark:text-white">School Details</h3>
<p class="text-xs text-slate-500 dark:text-slate-400">Grade, subjects, transcripts</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Account Settings -->
<button class="flex items-center p-4 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md transition-shadow group">
<div class="w-10 h-10 rounded-full bg-emerald-50 dark:bg-emerald-900/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">shield</span>
</div>
<div class="ml-4 flex-1 text-left">
<h3 class="text-base font-semibold text-slate-900 dark:text-white">Account Settings</h3>
<p class="text-xs text-slate-500 dark:text-slate-400">Privacy, password, notifications</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Help & Support -->
<button class="flex items-center p-4 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md transition-shadow group">
<div class="w-10 h-10 rounded-full bg-amber-50 dark:bg-amber-900/20 flex items-center justify-center text-amber-600 dark:text-amber-400 group-hover:bg-amber-600 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">help</span>
</div>
<div class="ml-4 flex-1 text-left">
<h3 class="text-base font-semibold text-slate-900 dark:text-white">Help &amp; Support</h3>
<p class="text-xs text-slate-500 dark:text-slate-400">FAQ, contact support</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
<!-- Logout -->
<div class="mt-8 mb-4">
<button class="w-full py-3 px-4 flex items-center justify-center gap-2 rounded-xl border border-red-100 bg-red-50 text-red-600 font-semibold hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/30 dark:text-red-400 transition-colors">
<span class="material-symbols-outlined text-xl">logout</span>
                    Log Out
                </button>
</div>
<p class="text-center text-xs text-slate-400 mt-4 mb-8">Pythagore App v2.4.1</p>
</main>
<!-- Bottom Navigation Bar -->
<nav class="absolute bottom-0 left-0 w-full border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 pb-6 pt-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex items-center justify-between">
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">calendar_month</span>
<span class="text-[10px] font-medium">Schedule</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">school</span>
<span class="text-[10px] font-medium">Grades</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-2xl fill-current">person</span>
<span class="text-[10px] font-medium">Profile</span>
</a>
</div>
</nav>
</div>
</body></html>
