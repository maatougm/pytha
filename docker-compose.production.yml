# =============================================================================
# School Hub - Production Docker Compose
# =============================================================================
# Usage:
#   1. Build Flutter: cd mobile && flutter build web --release
#   2. Deploy: docker-compose -f docker-compose.production.yml up -d
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_messaging
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./server/prisma/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"  # Localhost only for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sms_user} -d school_messaging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sms_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata_prod:/data
    ports:
      - "127.0.0.1:6379:6379"  # Localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # NestJS Backend API
  # ===========================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sms_server_prod
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-sms_user}:${DB_PASSWORD}@postgres:5432/school_messaging
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # Server
      PORT: 3000
      NODE_ENV: production
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:8085}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # File Upload
      MAX_FILE_SIZE: 10485760
      UPLOAD_DEST: ./uploads
    volumes:
      - uploads_prod:/app/uploads
      - logs_prod:/app/logs
    ports:
      - "127.0.0.1:3000:3000"  # Localhost only (use reverse proxy for external access)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Flutter Web Frontend
  # ===========================================================================
  flutter_web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web-production
    container_name: sms_flutter_web_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # HTTPS (if using SSL)
    depends_on:
      - server
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Nginx Reverse Proxy (Optional - for SSL/load balancing)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: sms_nginx_prod
    restart: unless-stopped
    profiles:
      - with-nginx  # Only start when explicitly requested
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
    depends_on:
      - flutter_web
      - server
    networks:
      - frontend
      - backend

# ===========================================================================
# Networks
# ===========================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # Backend network is internal (no external access)

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
  uploads_prod:
    driver: local
  logs_prod:
    driver: local
