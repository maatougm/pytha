<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="School Hub" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="mask-icon" href="/icons/icon-192x192.png" color="#1976d2" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- SEO Meta Tags -->
    <title>School Hub - Connecting Education</title>
    <meta name="description" content="School Hub - Real-time messaging and collaboration platform for teachers, parents, and students. Access courses, assignments, grades, and communicate seamlessly." />
    <meta name="keywords" content="school, education, messaging, students, teachers, parents, assignments, grades" />
    <meta name="author" content="School Hub" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="School Hub - Connecting Education" />
    <meta property="og:description" content="Real-time messaging and collaboration platform for teachers, parents, and students" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:site_name" content="School Hub" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="School Hub - Connecting Education" />
    <meta name="twitter:description" content="Real-time messaging and collaboration platform for teachers, parents, and students" />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    
    <!-- Splash Screen Styles (inline for instant render) -->
    <style>
      /* Critical CSS for splash screen */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      
      #app:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #E3F2FD 0%, #ffffff 100%);
        position: fixed;
        top: 0;
        left: 0;
      }
      
      #app:empty::after {
        content: 'School Hub';
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #2563eb;
      }
      
      /* Hide splash when app is loaded */
      #app:not(:empty)::before,
      #app:not(:empty)::after {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <!-- Service Worker Registration (fallback for browsers without auto-update) -->
    <script>
      // Register service worker manually if needed
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // The vite-plugin-pwa will handle registration in production
          // This is just a fallback and for debugging
          navigator.serviceWorker.getRegistration().then(registration => {
            if (registration) {
              console.log('[PWA] Service Worker registered:', registration.scope);
              
              // Listen for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available');
                    // Dispatch custom event for the app to handle
                    window.dispatchEvent(new CustomEvent('sw-update-available'));
                  }
                });
              });
            }
          });
        });
        
        // Handle messages from service worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_UPDATE') {
            window.dispatchEvent(new CustomEvent('sw-update-available'));
          }
        });
      }
    </script>
  </body>
</html>
