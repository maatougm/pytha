version: "3.8"

services:
  # Flutter Web Frontend
  flutter_web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
    container_name: sms_flutter_web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - API_BASE_URL=http://localhost:3000
    depends_on:
      - server

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - flutter_web
      - server

  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_messaging
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: sms_password_2026
    ports:
      - "5434:5432"  # Bind to different port to avoid local conflict
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d school_messaging"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "max_connections=200"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sms_pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DB_USER=sms_user
      - DB_PASSWORD=sms_password_2026
      - DB_HOST=postgres
      - DB_NAME=school_messaging
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sms_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sms_user:sms_password_2026@postgres:5432/school_messaging
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8085,http://localhost:5173,http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
