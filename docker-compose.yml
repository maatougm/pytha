version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: school-hub-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_password_2026}
      POSTGRES_DB: ${DB_NAME:-school_messaging}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sms_user} -d ${DB_NAME:-school_messaging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school-hub-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-hub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school-hub-network

  # Backend API (NestJS)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: school-hub-backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-sms_user}:${DB_PASSWORD:-sms_password_2026}@postgres:5432/${DB_NAME:-school_messaging}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - school-hub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Web App served by nginx)
  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
        WS_BASE_URL: ${WS_BASE_URL:-http://localhost:3000}
    container_name: school-hub-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school-hub-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - can use frontend directly)
  # This provides a unified entry point
  nginx:
    image: nginx:alpine
    container_name: school-hub-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - school-hub-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:

networks:
  school-hub-network:
    driver: bridge
